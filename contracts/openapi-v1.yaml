openapi: 3.1.0
info:
  title: AudioReader API
  version: 1.0.0-draft.1
  summary: Cross-device, multi-user API for AudioReader native clients and the admin console.
  description: Local-first synchronization, server-managed Qwen assistance, privacy-safe exact cache reuse, optional asset
    backup, and administration. Ordinary users never provide model credentials.
  contact:
    name: AudioReader project
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.example.com
  description: Production placeholder
- url: http://localhost:8787
  description: Local development
security:
- bearerAuth: []
tags:
- name: System
- name: Auth
- name: Profile
- name: Settings
- name: Devices
- name: Library
- name: Assets
- name: Progress
- name: Study
- name: Transcripts
- name: Assistant
- name: Sync
- name: Privacy
- name: Admin Users
- name: Admin AI
- name: Admin Cache
- name: Admin Jobs
- name: Admin Operations
- name: Admin Flags
- name: Admin Privacy
